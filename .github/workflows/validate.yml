name: Validate PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/assets/*.js | tr -d ' ')
          echo "JS bundle: ${SIZE} bytes"
          if [ "$SIZE" -gt 500000 ]; then
            echo "::warning::JS bundle exceeds 500KB"
          fi
