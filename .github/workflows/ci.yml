name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: ppnpm install
      - run: pnpm run lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: ppnpm install
      - run: pnpm test

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: ppnpm install
      - run: pnpm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: ppnpm install
      - run: pnpm audit --audit-level=high
        continue-on-error: true
