packages:
  - .

allowBuilds:
  esbuild: true

pnpm:
  legacyPeerDeps: true
  packageImportMethod: clone-or-copy

# Pin transitive dependencies to patched versions to clear security
# advisories (these come in via convex / vite / babel):
#   ws         >=8.21.0  GHSA-96hv-2xvq-fx4p (DoS) — supersedes the
#                        earlier 8.18.1 pin for CVE-2026-45736
#   esbuild    >=0.28.1  GHSA-gv7w-rqvm-qjhr (RCE via NPM_CONFIG_REGISTRY
#                        in the Deno module)
#   @babel/core >=7.29.1 GHSA-4x5r-pxfx-6jf8 (arbitrary file read via
#                        sourceMappingURL)
#   react-router >=7.15.1 GHSA-84g9-w2xq-vcv6 (CSRF via PUT/PATCH/DELETE)
overrides:
  ws: ">=8.21.0"
  esbuild: "^0.28.1"
  "@babel/core": ">=7.29.1"
  react-router: ">=7.15.1"
  undici: "^7.28.0"
