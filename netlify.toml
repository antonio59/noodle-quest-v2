[build]
  publish = "dist"
  # Deploy the Convex backend first (using CONVEX_DEPLOY_KEY from env),
  # then build the frontend so the two stay in sync. `npm run build`
  # already runs typecheck + lint + vite build, so no need to repeat lint.
  command = "npx convex deploy --cmd 'npm run build'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.giphy.com https://media*.giphy.com; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://api.giphy.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_CONVEX_URL = "https://incredible-lobster-12.eu-west-1.convex.cloud"

# Deploy previews and branch deploys can't (and shouldn't) deploy the
# Convex backend — build the frontend only, pointed at production Convex.
# Previously previews ran the production command and failed on every PR.
[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  VITE_CONVEX_URL = "https://incredible-lobster-12.eu-west-1.convex.cloud"

[context.branch-deploy]
  command = "npm run build"

[context.branch-deploy.environment]
  VITE_CONVEX_URL = "https://incredible-lobster-12.eu-west-1.convex.cloud"
